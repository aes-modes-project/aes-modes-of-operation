# Runs the tests, then publishes the learning app to GitHub Pages.
#
# Every push to main:
#   1. test   - installs the requirements and runs all tests (pytest)
#   2. deploy - builds the web version (tools/build_site.py) and publishes it to
#               https://<user>.github.io/<repo>/
#
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Tests and web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYODIDE_VERSION: "0.26.4"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Pyodide ${{ env.PYODIDE_VERSION }}
        run: |
          mkdir -p /tmp/pyodide && cd /tmp/pyodide
          npm pack "pyodide@${PYODIDE_VERSION}"
          tar xzf "pyodide-${PYODIDE_VERSION}.tgz"
      - name: Build the web version
        run: python tools/build_site.py --pyodide /tmp/pyodide/package --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
